project:
  name: vertexfleet-agent
  version: 0.1.0
  seed: 42

paths:            # relative to project root, resolved with pathlib
  data_raw: data/raw
  data_processed: data/processed
  data_synthetic: data/synthetic
  artifacts: 05_ml/artifacts
  audit_log: logs/audit.jsonl

simulation:
  n_vehicles: 50
  n_zones: 8
  n_days: 90

thresholds:
  percept_min_quality: 0.6        # below this a percept is marked low-quality
  entailment_support_min: 0.8     # probabilistic support needed to call something "supported"
  abstain_below_confidence: 0.55  # agent abstains / escalates below this
  failure_risk_high: 0.7          # predicted failure prob that triggers a maintenance proposal

agent:
  max_iterations: 5
  require_approval_for: [dispatch_maintenance, reposition_fleet]
  allowed_tools: [query_fleet_db, lookup_service_history, write_report, propose_action]

models:
  demand_forecaster: {name: gradient_boosting, version: "1.0.0", artifact: 05_ml/artifacts/demand_forecaster.joblib}
  failure_classifier: {name: stacking_isotonic, version: "1.0.0", artifact: 05_ml/artifacts/failure_classifier.joblib, alert_threshold: 0.23}
  maintenance_note_nlp: {name: tfidf_baseline, version: "0.0.1"}

features:
  use_llm_component: false
  enable_ui: true

sim_details:
  grid_size: 12          # city map is grid_size x grid_size
  train_days: 70         # days before this go to training, the rest to testing

logic_rules:
  vibration_high: 4.0    # mm/s
  overdue_days: 20       # days since service
  engine_hot: 100.0      # degrees C

csp:
  n_flagged: 9           # vehicles to schedule per day
  extra_travel_blocks: 3 # max blocks farther than the nearest depot
  urgent_vibration: 4.5  # mm/s; urgent vehicles must be seen in shift 1 or 2